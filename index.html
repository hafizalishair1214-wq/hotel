    <script>
      // Ensure window.fetch has both getter and setter so injected iframe shims don't throw TypeError
      (function() {
        try {
          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || obj === globalThis) && prop === 'fetch') {
              let _currentValue = descriptor.get ? descriptor.get() : descriptor.value;
              return origDefineProperty.call(Object, obj, prop, {
                configurable: true,
                enumerable: true,
                get() {
                  return descriptor.get ? descriptor.get() : _currentValue;
                },
                set(newVal) {
                  _currentValue = newVal;
                  if (descriptor.set) {
                    try { descriptor.set(newVal); } catch(e) {}
                  }
                }
              });
            }
            return origDefineProperty.apply(Object, arguments);
          };
        } catch(e) {}
      })();
    </script>
